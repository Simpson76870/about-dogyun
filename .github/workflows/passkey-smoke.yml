name: passkey-smoke-tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check public page and passkey API
        run: node passkey-smoke.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run virtual-authenticator WebAuthn end-to-end tests
        run: node passkey-e2e.mjs
