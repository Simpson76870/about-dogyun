<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도균의 기술 & 자기소개 페이지</title>
    <style>
        body { font-family: 'Arial', sans-serif; line-height: 1.6; margin: 0; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .btn { display: inline-block; background: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 16px; margin-top: 10px; }
        .btn:hover { background: #2980b9; }
        .skills-list { background: #eef2f5; padding: 15px; border-radius: 5px; list-style-type: square; }
        #interaction-result { margin-top: 15px; font-weight: bold; color: #27ae60; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 안녕하세요! 네트워크/IT를 공부하는 도균입니다.</h1>
        <p>컴퓨터 네트워크와 IT 기술을 공부하며 배운 내용을 기록하고 있습니다.</p>

        <h2>💻 주요 관심 분야 & 기술 스택</h2>
        <ul class="skills-list">
            <li>TCP/IP 및 네트워크 프로토콜 분석 (Wireshark)</li>
            <li>Cisco Packet Tracer 라우터/스위치 시뮬레이션</li>
            <li>네트워크 보안 및 패킷 구조 분석</li>
        </ul>

        <h2>🔗 블로그 & 링크</h2>
        <p>공부한 내용과 정리글은 아래 블로그에서 확인하실 수 있습니다.</p>
        <!-- 아래 href에 본인의 실제 블로그 주소를 넣으세요 -->
        <a href="https://blog.naver.com" target="_blank" class="btn">내 네이버 블로그 방문하기</a>

        <h2>⚡ 상호작용 테스트</h2>
        <p>버튼을 누르거나 키보드 'Enter' 키를 눌러보세요!</p>
        <button class="btn" onclick="handleClick()">인사하기 버튼</button>
        <p id="interaction-result"></p>
    </div>

    <script>
        function handleClick() {
            document.getElementById('interaction-result').innerText = '🎉 방문해주셔서 감사합니다! 멋진 하루 되세요.';
        }

        // 키보드 상호작용 (Enter 키 입력 시)
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                handleClick();
            }
        });
    </script>
</body>
</html>
