 const calc=()=>{const a=v('l_s'),b=v('l_e');if(a&&b){const m=Math.round((new Date(b+':00+09:00')-new Date(a+':00+09:00'))/60000);document.getElementById('l_m').value=m>=0?m:''}};
 view.append(el('div',{class:'card'},el('h2',{},'실제로 한 일 적기'),el('div',{class:'mut'},'원래 계획·예상 시간은 바뀌지 않고, 실제 기록은 따로 쌓입니다. 시각은 서울(KST) 기준입니다.'),
  el('div',{class:'f'},sel('l_t','어느 할 일의 기록인가요',ts.map(t=>[t.id,t.title]),S.logTask||ts[0]?.id),inp('l_s','시작 시각','datetime-local',''),inp('l_e','끝난 시각','datetime-local',''),inp('l_m','실제로 걸린 시간(분)','number','',{min:0}),inp('l_b','막혔던 이유 (없으면 비워 두기)','text','',{maxlength:300}),inp('l_n','메모','text','',{maxlength:300})),
  el('div',{class:'row'},el('button',{class:'pri',onclick:()=>act(async()=>{await rpc('pds_add_log',{p:{task_id:v('l_t'),started_at:v('l_s')+':00+09:00',ended_at:v('l_e')+':00+09:00',actual_minutes:+v('l_m'),blocked_reason:v('l_b'),note:v('l_n'),idempotency_key:S.logKey}});S.logKey=null;await load()})},'기록 저장'))));
 setTimeout(()=>{['l_s','l_e'].forEach(i=>document.getElementById(i)?.addEventListener('change',calc))});
 const ids=new Set(ts.map(t=>t.id)),ls=S.snap.logs.filter(l=>ids.has(l.task_id));
 view.append(el('h2',{},`실행 기록 ${ls.length}건`),...ls.map(l=>{const t=ts.find(x=>x.id===l.task_id);return el('div',{class:'card'},el('b',{},t.title),
  el('div',{},`${dt(l.started_at)} → ${dt(l.ended_at)} · 실제 ${mins(l.actual_minutes)} (계획 예상 ${mins(t.estimated_minutes)}, 변하지 않음)`),
  l.blocked_reason?el('div',{},'막힌 이유: '+l.blocked_reason):el('div',{class:'mut'},'막힌 이유 없음'),l.note?el('div',{class:'mut'},l.note):null)}))}

async function vReview(view){
 const r=await rpc('pds_review',{pid:S.planId});
 const M=[['plan','계획 수',r.plan_count,'지우지 않은 할 일 수'],['done','완료 수',r.done_count,'지금 완료 상태인 할 일'],['delayed','지연 수',r.delayed_count,'미완료이고 마감일이 서울 오늘('+r.today+')보다 앞'],['blocked','막힘 수',r.blocked_count,'막힌 이유가 적힌 할 일'],
  ['expected','예상 시간',mins(r.estimated_minutes),'할 일 예상 시간 합계'],['actual','실제 시간',mins(r.actual_minutes),'실행 기록 합계'],['diff','차이',(r.diff_minutes>0?'+':'')+r.diff_minutes+'분','실제 − 예상']];
 view.append(el('h2',{},'돌아보기 · '+plan().title),el('div',{class:'mut'},'숫자를 누르면 그 숫자가 나온 기록이 아래에 나옵니다.'),
  el('div',{class:'grid'},M.map(([k,n,val,d])=>el('button',{class:'stat'+(S.metric===k?' on':''),onclick:()=>act(async()=>{S.metric=k;S.recs=await rpc('pds_review_records',{pid:S.planId,metric:k});await render()})},n,el('b',{},val),el('span',{class:'mut'},d)))));
 if(S.recs){const nm=M.find(m=>m[0]===S.metric)[1];view.append(el('h2',{},`'${nm}'의 근거 기록 ${S.recs.length}건`),
  ...S.recs.map(t=>{const a=t.logs.reduce((s,l)=>s+l.actual_minutes,0);return el('div',{class:'card'},el('b',{},t.title),el('div',{class:'mut'},`마감 ${t.due_date} · ${t.status==='done'?'완료':'진행 중'} · 예상 ${mins(t.estimated_minutes)} · 실제 ${mins(a)}`),
   ...t.logs.map(l=>el('div',{},`· ${dt(l.started_at)}~${dt(l.ended_at)} ${mins(l.actual_minutes)}`+(l.blocked_reason?' / 막힘: '+l.blocked_reason:''))))}))}
 const note=S.snap.review_notes.find(n=>n.plan_id===S.planId);
 view.append(el('div',{class:'card'},el('h2',{},'고칠 점 한 줄 → 다음 계획'),
  note?el('div',{},'넘긴 한 줄: '+note.fix_text+' (다음 계획으로 이미 넘어감)'):el('div',{},inp('fx','다음 계획으로 넘길 고칠 점 한 가지','text','',{maxlength:200,style:'width:100%'}),
   el('button',{class:'pri',onclick:()=>act(async()=>{const fx=v('fx').trim();if(!fx)throw new Error('고칠 점을 한 줄 적어 주세요');const d=new Date(r.today+'T00:00:00Z'),e=new Date(d.getTime()+6*864e5);
    const id=await rpc('pds_carry_fix',{pid:S.planId,fix:fx,np:{title:'다음 계획: '+fx.slice(0,60),start_date:r.today,end_date:e.toISOString().slice(0,10),priority:'high',success_criteria:fx,estimated_minutes:0}});S.planId=id;S.tab='plan';await load()})},'다음 계획으로 넘기기'))))}

function vExport(view){view.append(el('div',{class:'card'},el('h2',{},'내 자료 전체 내보내기'),el('div',{class:'mut'},'계획·수정 이력·할 일·실행 기록·완료·돌아보기 메모를 JSON 파일 하나로 받습니다.'),
 el('button',{class:'pri',onclick:()=>act(async()=>{const s=await rpc('pds_snapshot');const a=el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'})),download:'plando-diary-export.json'});document.body.append(a);a.click();a.remove()})},'JSON 파일 내보내기')))}
async function vAccount(view){const {data,error}=await authClient.auth.getUser();if(error)throw error;const email=data.user?.email||'';view.append(el('div',{class:'card'},el('h2',{},'계정 관리'),el('p',{},'현재 로그인: '+email),el('p',{},'계정 삭제를 실행하면 이 계정의 다이어리 자료도 함께 삭제됩니다. 복구할 수 없습니다. 실제 계정이 아닌 시험 계정으로 먼저 확인하세요.'),el('label',{for:'deleteEmail'},'확인을 위해 현재 계정 이메일을 입력하세요'),el('input',{id:'deleteEmail',type:'email',autocomplete:'off',placeholder:'현재 계정 이메일'}),el('div',{class:'row'},el('button',{onclick:()=>act(async()=>{const typed=v('deleteEmail').trim().toLowerCase();if(!email||typed!==email.toLowerCase())throw new Error('현재 계정 이메일이 일치하지 않습니다.');if(!confirm('이 계정과 모든 다이어리 자료를 영구 삭제할까요?'))return;await rpc('pds_delete_my_account');try{await authClient.auth.signOut()}catch(e){}authSession=null;showAuth('login');showErr(new Error('계정 삭제 요청을 처리했습니다.'))})},'계정과 자료 영구 삭제'))))}
boot().catch(e=>{showErr(e);document.getElementById('view').textContent='인증을 시작하지 못했습니다. 잠시 뒤 새로고침해 주세요.'});
</script></body></html>
